[Serial]
Port=COM4
BaudRate=19200
ReconnectIntervalMs=3000

[Alarm]
PressureThreshold=2000

[Polling]
IntervalMs=3000

[Protocol]
; custom = 自定义帧协议（原逻辑）   modbus = Modbus RTU 主站
; 注意：两套协议串口参数不同，custom 用 8N1，modbus 用 8E1；改完需重启程序
Name=custom
ModbusSlaveAddress=1
; 必须大于从站最坏应答时间，太小会导致误超时并撞上"迟到应答"问题
ModbusResponseTimeoutMs=300
ModbusRetries=2
; 温度：读 1 个输入寄存器(0x04)；压力：从该地址起连续读 3 个
ModbusTempRegister=0
ModbusPressureRegister=16

